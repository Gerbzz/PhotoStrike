name: File fidelity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity:
    name: Fidelity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Install required Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Text library regressions
        run: cargo +1.95.0 test --locked -p photocraft-text --lib
      - name: PSD and PSB export regressions
        run: 'cargo +1.95.0 test --locked -p photocraft-io --lib psd_export::tests::'
      - name: Document roundtrips
        run: cargo +1.95.0 test --locked -p photocraft-io --test roundtrip

  required-native-windows:
    name: Required native Windows branding
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      PHOTOSTRIKE_REQUIRE_WINRES: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Install required Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install image inspection dependency
        run: python -m pip install Pillow==12.3.0
      - name: Approved artwork and package-path contracts
        run: python scripts/check_branding.py
      - name: Corrected handoff source contract
        run: python scripts/check_approved_branding.py
      - name: Native title-bar texture and exact approved pixels
        run: 'cargo +1.95.0 test --locked -p photocraft-ui-egui --lib brand::tests::'
      - name: Native window binding regressions
        run: cargo +1.95.0 test --locked -p photocraft --bin photostrike
      - name: Build native executable with required Windows icon resources
        run: cargo +1.95.0 build --locked -p photocraft --bin photostrike
      - name: Verify compiled Windows icon resources
        run: python scripts/check_windows_icon.py target/debug/photostrike.exe
      - name: Capture this exact source's running native window
        run: python scripts/capture_native_branding.py target/debug/photostrike.exe native-branding-evidence
      - name: Retain source-bound native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: photostrike-native-branding-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-branding-evidence/
          if-no-files-found: warn
